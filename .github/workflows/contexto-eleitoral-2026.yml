name: Validar contexto eleitoral 2026

on:
  workflow_dispatch:
  push:
    branches:
      - feat/contexto-eleitoral-vagas-eleitorado
    paths:
      - 'scripts/build_election_context_2026.py'
      - 'scripts/test_election_context_2026.py'
      - 'src/electionContext.jsx'
      - 'src/electionContext.css'
      - 'src/appEntry.jsx'
      - 'workers/tse-browser-probe/src/contextData.js'
      - 'workers/tse-browser-probe/wrangler.jsonc'
      - '.github/workflows/contexto-eleitoral-2026.yml'
  pull_request:
    paths:
      - 'scripts/build_election_context_2026.py'
      - 'scripts/test_election_context_2026.py'
      - 'src/electionContext.jsx'
      - 'src/electionContext.css'
      - 'src/appEntry.jsx'
      - 'workers/tse-browser-probe/src/contextData.js'
      - 'workers/tse-browser-probe/wrangler.jsonc'
      - '.github/workflows/contexto-eleitoral-2026.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Testar parser e regras do contexto eleitoral
        run: python scripts/test_election_context_2026.py

      - name: Validar sintaxe Python
        run: python -m py_compile scripts/build_election_context_2026.py scripts/fetch_candidates_cloud.py scripts/build_cargos_2026.py

      - name: Instalar dependências web
        run: npm install

      - name: Build do site
        run: npm run build

      - name: Validar bundle do Browser Worker
        working-directory: workers/tse-browser-probe
        run: |
          npm install
          npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
