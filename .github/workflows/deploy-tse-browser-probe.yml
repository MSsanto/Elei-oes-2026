name: Deploy TSE Browser Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/tse-browser-probe/**'
      - '.github/workflows/deploy-tse-browser-probe.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar credenciais do deploy alternativo
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy via GitHub Actions ignorado: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID nao configurados."
            echo "A integracao Git do Cloudflare continua responsavel pelo deploy automatico do Worker."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Credenciais opcionais configuradas; executando deploy via Wrangler."
          fi

      - name: Instalar dependencias do Worker
        if: steps.credentials.outputs.configured == 'true'
        working-directory: workers/tse-browser-probe
        run: npm install

      - name: Deploy do probe no Cloudflare Workers
        if: steps.credentials.outputs.configured == 'true'
        working-directory: workers/tse-browser-probe
        run: npx wrangler deploy

      - name: Confirmar rota de deploy utilizada
        if: steps.credentials.outputs.configured != 'true'
        run: echo "Workflow concluido sem erro; deploy automatico delegado a integracao Git do Cloudflare."
