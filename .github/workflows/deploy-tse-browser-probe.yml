name: Deploy TSE Browser Probe

on:
  # Arquivo histórico: exige reabertura explícita em novo commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    if: false # bloqueado pelo encerramento 2026
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias do Worker
        working-directory: workers/tse-browser-probe
        run: npm install

      - name: Validar build do Worker
        working-directory: workers/tse-browser-probe
        run: npm run check

      - name: Verificar credenciais do deploy alternativo
        if: github.event_name != 'pull_request'
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy via GitHub Actions ignorado: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID nao configurados."
            echo "A integracao Git do Cloudflare continua responsavel pelo deploy automatico do Worker."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Credenciais opcionais configuradas; executando deploy via Wrangler."
          fi

      - name: Deploy do probe no Cloudflare Workers
        if: github.event_name != 'pull_request' && steps.credentials.outputs.configured == 'true'
        working-directory: workers/tse-browser-probe
        run: npx wrangler deploy

      - name: Confirmar rota de deploy utilizada
        if: github.event_name != 'pull_request' && steps.credentials.outputs.configured != 'true'
        run: echo "Workflow concluido sem erro; deploy automatico delegado a integracao Git do Cloudflare."

      - name: Confirmar homologacao sem deploy
        if: github.event_name == 'pull_request'
        run: echo "Build do Worker validado em PR; nenhum deploy de producao foi executado."
