name: Migrar frontend para Senador

on:
  push:
    paths:
      - "scripts/migrate_frontend_senador.py"

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar migracao
        run: python scripts/migrate_frontend_senador.py

      - name: Publicar frontend atualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiCargoMain.jsx
          if git diff --cached --quiet; then
            echo "Frontend ja estava atualizado."
            exit 0
          fi
          git commit -m "feat: adicionar aba Senador ao frontend"
          git pull --rebase origin main
          git push origin HEAD:main
