name: Validar projeto

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar sintaxe dos coletores Python
        run: |
          python3 -m py_compile scripts/fetch_candidates.py
          python3 -m py_compile scripts/fetch_candidates_browser.py
          python3 -m py_compile scripts/fetch_candidates_cloud.py
          python3 -m py_compile scripts/build_cargos_2026.py
          python3 -m py_compile scripts/build_campaign_finance_2026.py
          python3 -m py_compile scripts/inspect_tse_complementary.py
          python3 -m py_compile scripts/inspect_divulgacand_fields.py
          python3 -m py_compile scripts/build_historical_ddd_2022.py
          python3 -m py_compile scripts/build_historical_ddd_2022_v2.py
          python3 -m py_compile scripts/apply_historical_ddd.py
          python3 -m py_compile scripts/fetch_camara.py
          python3 -m py_compile scripts/build_identity_map.py
          python3 -m py_compile scripts/fetch_camara_historico.py
          python3 -m py_compile scripts/fetch_camara_atividade.py
          python3 -m py_compile scripts/fetch_camara_atividade_cloud.py

      - name: Validar configuração dos cargos multi-cargo
        run: |
          python3 - <<'PY'
          import importlib.util
          import sys

          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('cargos2026', 'scripts/build_cargos_2026.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.TARGETS['PRESIDENTE']['code'] == '1'
          assert module.TARGETS['GOVERNADOR']['code'] == '3'
          assert module.TARGETS['SENADOR']['code'] == '5'
          assert module.TARGETS['DEPUTADO ESTADUAL']['code'] == '7'
          assert module.TARGETS['DEPUTADO DISTRITAL']['code'] == '8'
          assert module.TARGETS['PRESIDENTE']['slug'] == 'presidente'
          assert module.TARGETS['GOVERNADOR']['slug'] == 'governador'
          assert module.TARGETS['SENADOR']['slug'] == 'senador'
          assert module.TARGETS['DEPUTADO ESTADUAL']['slug'] == 'deputado-estadual'
          assert module.TARGETS['DEPUTADO DISTRITAL']['slug'] == 'deputado-estadual'
          assert module.STATE_DEPUTY_PAGE_SIZE == 60
          print('OK: cargos multi-cargo, incluindo Estadual/Distrital, configurados')
          PY

      - name: Validar processador de financas eleitorais
        run: |
          python3 - <<'PY'
          import csv
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('finance', 'scripts/build_campaign_finance_2026.py')
          finance = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(finance)

          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              receita = base / 'receitas_candidatos_2026_BRASIL.csv'
              despesa = base / 'despesas_contratadas_candidatos_2026_BRASIL.csv'

              with receita.open('w', encoding='latin-1', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=['SQ_CANDIDATO','VR_RECEITA','DS_FONTE_RECEITA','DS_ORIGEM_RECEITA','NM_DOADOR','DT_RECEITA'], delimiter=';')
                  writer.writeheader()
                  writer.writerow({'SQ_CANDIDATO':'123','VR_RECEITA':'1000,00','DS_FONTE_RECEITA':'Fundo Especial','DS_ORIGEM_RECEITA':'Transferência','NM_DOADOR':'Partido Exemplo','DT_RECEITA':'01/09/2026'})

              with despesa.open('w', encoding='latin-1', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=['SQ_CANDIDATO','VR_DESPESA_CONTRATADA','DS_ORIGEM_DESPESA','NM_FORNECEDOR','DT_DESPESA'], delimiter=';')
                  writer.writeheader()
                  writer.writerow({'SQ_CANDIDATO':'123','VR_DESPESA_CONTRATADA':'250,00','DS_ORIGEM_DESPESA':'Publicidade','NM_FORNECEDOR':'Fornecedor Exemplo','DT_DESPESA':'02/09/2026'})

              original = finance.OUTPUT_DIR
              finance.OUTPUT_DIR = base / 'out'
              manifest = finance.process(base)
              payload = json.loads((finance.OUTPUT_DIR / '123.json').read_text(encoding='utf-8'))
              finance.OUTPUT_DIR = original

              assert manifest['candidates'] == 1
              assert payload['resumo']['total_receitas'] == 1000.0
              assert payload['resumo']['total_despesas_contratadas'] == 250.0
              assert payload['receitas_por_fonte'][0]['categoria'] == 'Fundo Especial'
              assert payload['despesas_por_categoria'][0]['categoria'] == 'Publicidade'
          print('OK: agregacao financeira por candidato')
          PY

      - name: Validar assinatura conservadora do historico regional
        run: |
          python3 - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "historico_ddd", "scripts/build_historical_ddd_2022.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          a = module.identity_signature("José da Silva", "01/02/1980", "MASCULINO")
          b = module.identity_signature("JOSE   DA SILVA", "01/02/1980", "masculino")
          c = module.identity_signature("Jose da Silva", "02/02/1980", "MASCULINO")
          assert a == b
          assert a != c
          print("OK: assinatura exige nome, nascimento e genero")
          PY

      - name: Validar leitura de CSV da Camara com quebra de linha
        run: |
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "fetch_camara_atividade", "scripts/fetch_camara_atividade.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          sample = (
              'id;descricao;data\r\n'
              '1;"Texto com\r\nquebra de linha interna";2026-09-03\r\n'
              '2;"Linha simples";2026-09-03\r\n'
          )
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "votacoes.csv"
              path.write_bytes(sample.encode("utf-8"))
              rows = module.read_csv(path)
              assert len(rows) == 2, rows
              assert rows[0]["id"] == "1", rows[0]
              assert "quebra de linha interna" in rows[0]["descricao"], rows[0]
          print("OK: CSV multiline preservado")
          PY

      - name: Validar sintaxe dos coletores PowerShell
        shell: pwsh
        run: |
          $files = @(
            'scripts/windows/coletar_e_publicar.ps1',
            'scripts/windows/fetch_candidates_windows.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "OK: $file"
          }

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Validar build do site
        run: npm run build

      - name: Instalar dependencias do probe Cloudflare
        working-directory: workers/tse-browser-probe
        run: npm install

      - name: Validar bundle do probe Cloudflare
        working-directory: workers/tse-browser-probe
        run: npm run check
