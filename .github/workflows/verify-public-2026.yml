name: Diagnosticar versão pública do arquivo 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-2026.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnóstico de rotas, bundle e snapshot sem alterar produção
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://eleicoes-2026-ebz.pages.dev'
          for PATHNAME in / /eleitos /encerramento-2026 /data/resultados-2026/status-por-candidato.json; do
            STATUS="$(curl --silent --show-error --location --max-time 20 --output "$RUNNER_TEMP/page" --write-out '%{http_code}' "$BASE$PATHNAME")"
            BYTES="$(wc -c < "$RUNNER_TEMP/page")"
            echo "Rota $PATHNAME: HTTP $STATUS, $BYTES bytes"
            if [ "$PATHNAME" = '/eleitos' ] && [ "$STATUS" = '200' ]; then
              if grep -Fq 'id="root"' "$RUNNER_TEMP/page"; then echo 'HTML SPA: SIM'; else echo 'HTML SPA: NÃO'; fi
              ASSET="$(grep -oE '/assets/[^"]+\.js' "$RUNNER_TEMP/page" | head -n 1 || true)"
              echo "Asset: ${ASSET:-ausente}"
              if [ -n "$ASSET" ]; then
                curl --silent --show-error --location --max-time 20 "$BASE$ASSET" -o "$RUNNER_TEMP/bundle"
                for MARKER in 'Eleitas e eleitos' 'PANORAMA ELEITORAL' 'O projeto Eleições 2026 foi concluído.'; do
                  if grep -Fq "$MARKER" "$RUNNER_TEMP/bundle"; then echo "Marcador $MARKER: SIM"; else echo "Marcador $MARKER: NÃO"; fi
                done
              fi
            fi
          done
