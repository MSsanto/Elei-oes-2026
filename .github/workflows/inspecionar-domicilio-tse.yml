name: Inspecionar domicilio eleitoral TSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inspecionar cabecalhos do ZIP complementar do TSE
        env:
          TSE_WORKER_URL: https://eleicoes-2026-tse-browser-probe.matheus-sergio.workers.dev/download
          TSE_WORKER_TOKEN: ${{ secrets.TSE_WORKER_TOKEN }}
        run: python scripts/inspect_tse_complementary.py
