name: Publicação única - arquivo eleitoral 2026
# Reexecução pontual após atualização do Account ID, autorizada em docs/REABERTURA_2026.md.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-arquivo-2026-uma-vez.yml'

permissions:
  contents: read

concurrency:
  group: publicacao-pontual-final-2026
  cancel-in-progress: false

jobs:
  publish:
    name: Build e publicação do arquivo eleitoral
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_OVERRIDE: ${{ inputs.project_name || vars.CLOUDFLARE_PAGES_PROJECT || '' }}
    steps:
      - name: Checkout da versão encerrada
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Diagnosticar identidade da conta Cloudflare
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = (process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const account = (process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const formatValid = /^[a-f0-9]{32}$/i.test(account);
          console.log('Formato do Account ID (32 caracteres hexadecimais):', formatValid ? 'válido' : 'INVÁLIDO');
          if (!token || !account) {
            console.error('::error::Um dos secrets Cloudflare está vazio.');
            process.exit(1);
          }
          try {
            const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
              headers: { Authorization: 'Bearer ' + token },
            });
            const payload = await response.json();
            console.log('Verificação do API Token:', response.ok && payload.success ? 'válido' : 'rejeitado', 'HTTP', response.status);
            if (!response.ok || !payload.success) {
              console.error('::error::API Token inválido, revogado ou sem autorização.');
              process.exit(1);
            }
          } catch (error) {
            console.error('::error::Falha ao verificar API Token na Cloudflare:', error.message);
            process.exit(1);
          }
          let resolvedAccount = account;
          if (!formatValid) {
            console.log('Tentando descobrir automaticamente a conta e projeto Pages autorizados pelo token.');
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=100', {
              headers: { Authorization: 'Bearer ' + token },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success || !Array.isArray(payload.result)) {
              const codes = (payload.errors || []).map(item => item.code).filter(Boolean).join(',');
              console.error('::error::O token não pode listar as contas Cloudflare. Corrija o Account ID manualmente. HTTP ' + response.status + ', códigos: ' + (codes || 'indisponíveis'));
              process.exit(1);
            }
            const matched = [];
            for (const candidate of payload.result) {
              if (!/^[a-f0-9]{32}$/i.test(candidate.id || '')) continue;
              const list = await fetch('https://api.cloudflare.com/client/v4/accounts/' + candidate.id + '/pages/projects', {
                headers: { Authorization: 'Bearer ' + token },
              });
              const projects = await list.json();
              if (!list.ok || !projects.success || !Array.isArray(projects.result)) continue;
              for (const item of projects.result) {
                if (item.subdomain === 'eleicoes-2026-ebz.pages.dev' ||
                    item.name === 'eleicoes-2026-ebz' ||
                    (Array.isArray(item.domains) && item.domains.includes('eleicoes-2026-ebz.pages.dev'))) {
                  matched.push({ accountId: candidate.id, projectName: item.name });
                }
              }
            }
            if (matched.length !== 1) {
              console.error('::error::Não foi possível identificar uma única conta dona do projeto eleicoes-2026-ebz. Corrija CLOUDFLARE_ACCOUNT_ID no GitHub.');
              process.exit(1);
            }
            resolvedAccount = matched[0].accountId;
            console.log('Conta correta identificada de forma segura; prosseguindo com publicação excepcional.');
            process.stdout.write('::add-mask::' + resolvedAccount + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_ACCOUNT_ID=' + resolvedAccount + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'PAGES_PROJECT_NAME=' + matched[0].projectName + '\n');
          }
          const url = 'https://api.cloudflare.com/client/v4/accounts/' + resolvedAccount + '/pages/projects';
          const response = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
          const payload = await response.json();
          if (!response.ok || !payload.success) {
            const codes = (payload.errors || []).map(item => item.code).filter(Boolean).join(',');
            console.error('::error::Account ID não autorizado ou não encontrado para o token. HTTP ' + response.status + ' / Cloudflare: ' + (codes || 'sem código'));
            process.exit(1);
          }
          if (!Array.isArray(payload.result)) {
            console.error('::error::Resposta da API de Pages não contém projetos em formato reconhecido.');
            process.exit(1);
          }
          const domain = 'eleicoes-2026-ebz.pages.dev';
          const match = payload.result.find(item => item.subdomain === domain ||
            (Array.isArray(item.domains) && item.domains.includes(domain)));
          if (!match) {
            console.error('::error::A conta autenticada não possui projeto Pages vinculado ao domínio solicitado.');
            console.log('Projetos disponíveis:', payload.result.map(item => item.name).join(', '));
            process.exit(1);
          }
          console.log('Projeto Pages confirmado para o domínio:', match.name);
          fs.appendFileSync(process.env.GITHUB_ENV, 'PAGES_PROJECT_NAME=' + match.name + '\n');
          console.log('Conta acessível; projetos Pages visíveis pela API:', Array.isArray(payload.result) ? payload.result.length : 'resposta inesperada');
          console.log('Nomes de projetos Pages autorizados:', Array.isArray(payload.result) ? payload.result.map(item => item.name).join(', ') || '(nenhum)' : '(desconhecido)');
          console.log('Domínios Pages autorizados:', Array.isArray(payload.result) ? payload.result.map(item => item.name + ' = ' + item.subdomain + ' (' + (item.domains || []).join(', ') + ')').join('; ') : '(desconhecido)');
          NODE

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Construir e validar o site
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fxq '/* /index.html 200' dist/_redirects
          grep -Rq 'O projeto Eleições 2026 foi concluído.' dist/assets/
          grep -Rq 'Eleitas e eleitos' dist/assets/
          test -f dist/data/resultados-2026/status-por-candidato.json

      - name: Conferir credenciais do Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure os secrets CLOUDFLARE_API_TOKEN (Pages Write) e CLOUDFLARE_ACCOUNT_ID no GitHub. Build validado, mas publicação não realizada."
            exit 1
          fi

      - name: Descobrir projeto correto no Cloudflare
        shell: bash
        run: |
          npx --yes wrangler@4 pages project list --json > "$RUNNER_TEMP/cloudflare-pages-projects.json"
          node --input-type=commonjs - "$RUNNER_TEMP/cloudflare-pages-projects.json" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const projects = Array.isArray(data)
            ? data
            : (Array.isArray(data.result) ? data.result : (Array.isArray(data.projects) ? data.projects : []));
          console.log('Formato da resposta do Wrangler:', Array.isArray(data) ? 'array' : Object.keys(data || {}).join(', '));
          const domain = 'eleicoes-2026-ebz.pages.dev';
          const wanted = (process.env.PROJECT_OVERRIDE || '').trim();
          const matches = (project) => {
            const domains = Array.isArray(project.domains) ? project.domains : [];
            return project.subdomain === domain || domains.includes(domain) ||
              domains.some((value) => typeof value === 'object' && value?.name === domain);
          };
          const project = wanted
            ? projects.find((entry) => entry.name === wanted)
            : projects.find(matches) || projects.find((entry) => entry.name === 'eleicoes-2026-ebz');
          if (!project) {
            console.error('::error::Projeto de destino não encontrado. Informe o input project_name ou a variável CLOUDFLARE_PAGES_PROJECT.');
            console.error('Projetos acessíveis ao token:', projects.map((p) => p.name).join(', ') || '(nenhum)');
            process.exit(1);
          }
          console.log('Projeto Pages selecionado:', project.name);
          fs.appendFileSync(process.env.GITHUB_ENV, `PAGES_PROJECT_NAME=${project.name}\n`);
          NODE

      - name: Publicar a versão final, sem reativar coletas
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PAGES_PROJECT_NAME" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Publicação pública do encerramento 2026"

      - name: Conferir que a rota pública aponta para a versão de encerramento
        shell: bash
        run: |
          set -euo pipefail
          URL='https://eleicoes-2026-ebz.pages.dev/encerramento-2026'
          curl --fail --silent --show-error --location --retry 3 --retry-delay 4 "$URL" -o "$RUNNER_TEMP/encerramento.html"
          grep -Fq 'id="root"' "$RUNNER_TEMP/encerramento.html"
          ASSET="$(grep -oE '/assets/[^"]+\.js' "$RUNNER_TEMP/encerramento.html" | head -n 1)"
          if [ -z "$ASSET" ]; then
            echo "::error::HTML publicado, mas bundle JS não localizado no index."
            exit 1
          fi
          curl --fail --silent --show-error --location "https://eleicoes-2026-ebz.pages.dev$ASSET" -o "$RUNNER_TEMP/encerramento-bundle.js"
          if ! grep -Fq 'O projeto Eleições 2026 foi concluído.' "$RUNNER_TEMP/encerramento-bundle.js"; then
            echo "::error::A versão pública ainda não contém o encerramento 2026."
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-delay 4 "https://eleicoes-2026-ebz.pages.dev/eleitos" -o "$RUNNER_TEMP/eleitos.html"
          grep -Fq 'id="root"' "$RUNNER_TEMP/eleitos.html"
          grep -Fq 'Eleitas e eleitos' "$RUNNER_TEMP/encerramento-bundle.js"
          echo "OK: site e bundle públicos incluem o encerramento e a consulta de eleitas e eleitos."
