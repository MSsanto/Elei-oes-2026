name: Coleta online TSE + Camara

on:
  # Congelado em 22/10/2026. A partir daqui, coleta somente por acionamento manual.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-online-eleicoes-2026
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Coletar candidatos do TSE via Cloudflare Browser Run
        env:
          TSE_WORKER_URL: https://eleicoes-2026-tse-browser-probe.matheus-sergio.workers.dev/download
          TSE_WORKER_TOKEN: ${{ secrets.TSE_WORKER_TOKEN }}
        run: python scripts/fetch_candidates_cloud.py

      - name: Gerar bases de Presidente, Governador, Senador e Deputado Estadual/Distrital
        run: python scripts/build_cargos_2026.py

      - name: Enriquecer situação oficial dos registros de candidatura
        env:
          TSE_STATUS_WORKER_URL: https://eleicoes-2026-tse-browser-probe.matheus-sergio.workers.dev/candidate-statuses
          TSE_WORKER_TOKEN: ${{ secrets.TSE_WORKER_TOKEN }}
        run: python scripts/enrich_candidate_statuses.py

      - name: Reaplicar historico regional por DDD de 2022
        run: python scripts/apply_historical_ddd.py

      - name: Atualizar catalogo historico da Camara
        run: python scripts/fetch_camara.py --max-age-hours 24

      - name: Atualizar mapa de identidades TSE e Camara
        run: python scripts/build_identity_map.py

      - name: Atualizar historico parlamentar
        run: python scripts/fetch_camara_historico.py --max-age-hours 12

      - name: Atualizar atividade parlamentar de 2023 a 2026
        run: python scripts/fetch_camara_atividade_cloud.py --anos 2023,2024,2025,2026 --max-age-hours 24 --historical-max-age-hours 720

      - name: Publicar dados processados no repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de dados para publicar."
            exit 0
          fi

          git commit -m "data: atualizar TSE e historico da Camara via cloud"
          git pull --rebase origin main
          git push origin HEAD:main
