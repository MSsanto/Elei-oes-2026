name: Coleta financas eleitorais 2026

on:
  workflow_dispatch:
  schedule:
    # 06:40 e 18:40 em Brasilia (UTC-3).
    - cron: "40 9,21 * * *"
  push:
    branches:
      - main
    paths:
      - '.github/finance-trigger.txt'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/fetch_campaign_finance_cloud.py'
      - 'scripts/build_campaign_finance_2026.py'
      - '.github/workflows/coleta-financas-2026.yml'

permissions:
  contents: write

concurrency:
  group: coleta-financas-eleicoes-2026-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validar coletor financeiro em PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python -m py_compile \
            scripts/fetch_campaign_finance_cloud.py \
            scripts/build_campaign_finance_2026.py

          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          scripts_dir = Path('scripts').resolve()
          sys.path.insert(0, str(scripts_dir))
          path = scripts_dir / 'fetch_campaign_finance_cloud.py'
          spec = importlib.util.spec_from_file_location('finance_collector', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.DEFAULT_SOURCE_URL.startswith('https://cdn.tse.jus.br/')
          assert 'prestacao_de_contas_eleitorais_candidatos_2026.zip' in module.DEFAULT_SOURCE_URL
          assert module.DEFAULT_WORKER_URL.startswith('https://')
          assert module.MIN_ZIP_BYTES >= 10_000
          print('OK: coletor financeiro compila e possui transportes/guardrails configurados.')
          PY

      - name: Baixar e processar Prestacao de Contas Eleitorais 2026
        if: github.event_name != 'pull_request'
        id: collect
        continue-on-error: true
        env:
          # O CDN oficial e tentado diretamente e o Browser Worker cobre o bloqueio
          # observado nos runners GitHub/Azure (HTTP 403 do CDN do TSE).
          TSE_FINANCE_SOURCE_URL: https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip
          TSE_FINANCE_WORKER_URL: https://eleicoes-2026-tse-browser-probe.matheus-sergio.workers.dev/download?dataset=prestacaoCandidatos2026
          TSE_WORKER_TOKEN: ${{ secrets.TSE_WORKER_TOKEN }}
          TSE_FINANCE_MAX_ATTEMPTS: "3"
          TSE_FINANCE_RETRY_SECONDS: "15"
        run: python scripts/fetch_campaign_finance_cloud.py

      - name: Publicar diagnostico da falha
        if: github.event_name != 'pull_request' && steps.collect.outcome != 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/finance-collection.json

          if git diff --cached --quiet; then
            echo "Nenhum diagnostico novo para publicar."
          else
            git commit -m "status: registrar falha da coleta financeira"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Encerrar com falha se a coleta nao concluiu
        if: github.event_name != 'pull_request' && steps.collect.outcome != 'success'
        shell: bash
        run: |
          echo "A coleta financeira falhou; o ultimo snapshot valido foi preservado."
          exit 1

      - name: Validar carga financeira
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/processed/financas-2026')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          candidates = int(manifest.get('candidates', 0))
          shards = int(manifest.get('shard_count', 0))
          assert candidates > 0, manifest
          assert 0 < shards <= 256, manifest

          shard_files = list((root / 'shards').glob('*.json'))
          assert len(shard_files) == shards, (len(shard_files), shards)

          sampled = 0
          for path in shard_files[:8]:
              payload = json.loads(path.read_text(encoding='utf-8'))
              for candidate_id, record in list(payload.items())[:4]:
                  assert str(record.get('id_tse')) == str(candidate_id)
                  assert 'resumo' in record
                  sampled += 1
          assert sampled > 0

          supplier_index = root / 'fornecedores' / 'index.json'
          assert supplier_index.exists(), 'Indice integral de fornecedores nao foi gerado.'
          suppliers = json.loads(supplier_index.read_text(encoding='utf-8'))
          assert isinstance(suppliers, list), type(suppliers)
          print(f'OK: {candidates} candidaturas financeiras em {shards} shards; {sampled} registros amostrados; {len(suppliers)} fornecedores')
          PY

      - name: Atualizar camada editorial
        if: github.event_name != 'pull_request'
        shell: bash
        run: node scripts/build_editorial_phase2.mjs --persist

      - name: Validar camada editorial
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const base = 'data/processed/editorial';
          const manifest = JSON.parse(fs.readFileSync(`${base}/manifest.json`, 'utf8'));
          const radar = JSON.parse(fs.readFileSync(`${base}/radar.json`, 'utf8'));
          const finance = JSON.parse(fs.readFileSync(`${base}/finance-overview.json`, 'utf8'));
          if (!manifest.finance_records) throw new Error('Camada editorial sem perfis financeiros.');
          if (!Array.isArray(radar.events)) throw new Error('Radar editorial invalido.');
          if (!Number.isFinite(Number(finance.total_receitas))) throw new Error('Agregado financeiro invalido.');
          console.log(`OK: editorial com ${radar.events.length} eventos e ${manifest.supplier_records} fornecedores.`);
          JS

      - name: Publicar carga processada
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/financas-2026 data/processed/editorial data/status/finance-collection.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao financeira/editorial/status para publicar."
            exit 0
          fi

          git commit -m "data: atualizar prestacao de contas e camada editorial"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
